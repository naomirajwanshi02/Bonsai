<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonsai target maker</title>
<style>
  body{margin:0;padding:16px;background:#ecdfc6;color:#3b2a1c;font:14px/1.5 ui-monospace,Consolas,monospace}
  img{max-width:420px;width:100%;box-shadow:0 0 0 1px #8c7457;display:block;margin:10px 0}
  button{font:inherit;padding:8px 14px;margin-right:6px}
  #log{white-space:pre-wrap}
</style></head>
<body>
<p>Makes <b>target.png</b> (the card you scan: the bonsai painting on a sepia plate) and compiles it into
<b>targets.mind</b> with MindAR's own compiler. Run it from <code>tools/serve.ps1</code>, which accepts the files back.
<code>?build=1</code> does both steps.</p>
<button id="draw">1 · Make target.png</button><button id="compile">2 · Compile .mind</button>
<div id="log"></div>
<div id="out"></div>
<script type="module">
const params = new URLSearchParams(location.search);
const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
const out = document.getElementById('out');
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
const load = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error('could not load ' + src)); i.src = src; });

// The painting arrived with a dark strip along its bottom edge: find where the paper ends.
function paintedHeight(img){
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  for (let y = c.height - 1; y > c.height * 0.8; y--){
    let sum = 0;
    for (let x = 0; x < c.width; x++){ const i = (y * c.width + x) * 4; sum += d[i] + d[i + 1] + d[i + 2]; }
    if (sum / (c.width * 3) > 200) return y - 2;
  }
  return c.height;
}

async function draw(){
  const img = await load('../assets/illustration.png?' + Date.now());
  const ph = paintedHeight(img);
  const W = 1000, H = 1400, r = rng(2411);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  // warm paper with fibres and speckle: texture the tracker can lock onto
  g.fillStyle = '#f1e5cc'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++){
    const x = r() * W, y = r() * H, a = r() * 6.28, l = 3 + r() * 14;
    g.strokeStyle = `rgba(140,116,87,${0.1 + r() * 0.22})`; g.lineWidth = 0.6 + r();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 700; i++){ g.fillStyle = `rgba(59,42,28,${0.15 + r() * 0.45})`; g.beginPath(); g.arc(r() * W, r() * H, 0.6 + r() * 1.6, 0, 6.28); g.fill(); }
  // plate frame and rulers, as on every NomAR card
  g.strokeStyle = '#3b2a1c'; g.lineWidth = 4; g.strokeRect(22, 22, W - 44, H - 44);
  g.strokeStyle = '#8c7457'; g.lineWidth = 1.5; g.strokeRect(34, 34, W - 68, H - 68);
  for (let x = 40, n = 0; x < W - 40; x += 12, n++){ const major = n % 5 === 0; g.strokeStyle = '#3b2a1c'; g.lineWidth = major ? 2 : 1; g.beginPath(); g.moveTo(x, 34); g.lineTo(x, 34 + (major ? 16 : 8)); g.stroke(); }
  for (let y = 40, n = 0; y < H - 40; y += 12, n++){ const major = n % 5 === 0; g.lineWidth = major ? 2 : 1; g.beginPath(); g.moveTo(34, y); g.lineTo(34 + (major ? 16 : 8), y); g.stroke(); }
  // the painting, multiplied onto the paper so its white ground becomes the card
  const pw = 840, scale = pw / img.naturalWidth, phh = ph * scale;
  g.save(); g.globalCompositeOperation = 'multiply'; g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, img.naturalWidth, ph, (W - pw) / 2, 230, pw, phh);
  g.restore();
  // title block
  g.fillStyle = '#2b1e13'; g.font = '700 58px Georgia,"Times New Roman",serif'; g.fillText('GROW A', 80, 130);
  const gap = 80 + g.measureText('GROW A').width + 22;
  g.fillStyle = '#b5452f'; g.font = 'italic 700 100px Georgia,"Times New Roman",serif'; g.fillText('Bonsai', gap, 140);
  g.fillStyle = '#5b4630'; g.font = '20px Consolas,monospace';
  g.fillText('FIG. 01 · SCAN ME · JAPANESE BLACK PINE', 72, H - 70);
  g.fillText('PINUS THUNBERGII · INFORMAL UPRIGHT', 72, H - 44);
  // a round seal with a little tree
  g.save(); g.translate(870, H - 120); g.rotate(-0.2);
  g.strokeStyle = '#b5452f'; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 54, 0, 6.28); g.stroke();
  g.fillStyle = '#b5452f';
  g.beginPath(); g.ellipse(0, -18, 30, 12, 0, 0, 6.28); g.fill();
  g.beginPath(); g.ellipse(22, 2, 18, 8, 0, 0, 6.28); g.fill();
  g.beginPath(); g.ellipse(-22, 6, 18, 8, 0, 0, 6.28); g.fill();
  g.fillRect(-4, -8, 8, 36); g.fillRect(-26, 28, 52, 10);
  g.restore();
  log(`painting ${img.naturalWidth} × ${img.naturalHeight} (paper ends at ${ph}) → card ${W} × ${H}`);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
  out.innerHTML = '';
  const shown = new Image(); shown.src = URL.createObjectURL(blob); out.appendChild(shown);
  const res = await fetch('/__save?name=target.png', { method: 'POST', body: blob });
  log(`target.png: ${res.ok ? 'saved' : 'save failed'} (${(blob.size / 1024).toFixed(0)} KB)`);
}

async function compile(){
  log('loading MindAR compiler…');
  await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
  const img = new Image();
  img.src = '../target.png?' + Date.now();
  await img.decode();
  const compiler = new window.MINDAR.IMAGE.Compiler();
  let last = -10;
  const data = await compiler.compileImageTargets([img], (p) => { if (p - last >= 10){ last = p; log(`compiling ${p.toFixed(0)}%`); } });
  const t = data[0];
  log(`detection points: ${t.matchingData.reduce((n, l) => n + l.maximaPoints.length + l.minimaPoints.length, 0)} over ${t.matchingData.length} scales; tracking points: ${t.trackingData.reduce((n, l) => n + l.points.length, 0)}`);
  const buf = await compiler.exportData();
  const res = await fetch('/__save?name=targets.mind', { method: 'POST', body: new Blob([buf]) });
  log(`targets.mind: ${res.ok ? 'saved' : 'save failed'}`);
  window.__done = true;
}

document.getElementById('draw').onclick = draw;
document.getElementById('compile').onclick = compile;
if (params.has('build')) draw().then(compile).catch((e) => { log('ERROR ' + e); window.__done = 'error'; });
</script>
</body></html>
